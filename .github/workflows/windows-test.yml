name: Windows tests

# Runs the Rust unit tests of the Tauri app on Windows (the build workflow only
# compiles), so #[cfg(windows)] code and the WSL/UNC helpers are covered too.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      # tauri-build needs the frontend dist folder to exist.
      - run: npm run build
      - name: cargo test
        working-directory: windows/src-tauri
        run: cargo test --lib --no-fail-fast
